[package]
name = "screen-peek-alert"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

[features]
default = []
# Enables `tests/detector_onnx.rs` + `tests/embedder_onnx.rs` (requires ONNX files under `src-tauri/models/`).
onnx-integration-tests = []

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "screen_peek_alert_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-fs = "2"
tauri-plugin-keyring = "0.1.0"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nokhwa = { version = "0.10", features = ["input-native"] }
image = { version = "0.25", features = ["jpeg", "png", "bmp", "gif", "webp"] }
fast_image_resize = { version = "4", features = ["image"] }
ort = { version = "=2.0.0-rc.10", features = ["ndarray", "load-dynamic", "download-binaries", "copy-dylibs"] }
ndarray = "0.16"
nalgebra = { version = "0.33", default-features = false, features = ["std"] }
ring = "0.17.14"
ureq = { version = "2.12", features = ["tls"] }
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"

[dev-dependencies]
insta = "1"
proptest = "1"
tempfile = "3"

[profile.dev]
opt-level = 2
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2

